<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/brand/favicon.png" sizes="192x192" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdfaf4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1410" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="ধী — ন্যাশনাল কারিকুলামের যেকোনো চ্যাপ্টার থেকে ওয়ার্কশিট, কুইজ আর স্টাডি নোট, বাংলায়। Dhi turns any chapter of the national curriculum into Bangla worksheets, quizzes and study notes."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/brand/logo-mark.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>ধী · Dhi</title>

    <script>
      /* Paint the stored theme before React mounts, otherwise a dark-mode
         visitor sees a flash of the light palette on every load. Keep the
         storage key and attribute in sync with src/shared/theme/index.js. */
      (function () {
        try {
          var stored = localStorage.getItem("dhi.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var lang = localStorage.getItem("dhi.lang");
          if (lang === "bn" || lang === "en") document.documentElement.lang = lang;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>এই অ্যাপটি চালাতে জাভাস্ক্রিপ্ট চালু করুন। You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
