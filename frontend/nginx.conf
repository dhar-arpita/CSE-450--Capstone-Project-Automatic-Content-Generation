server {
  listen 80;
  root /usr/share/nginx/html;

  # Everything webpack emits under /static/ carries a content hash in its
  # filename, so it can be cached hard — a new build produces new names and the
  # browser fetches them because the URL changed.
  location ^~ /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html has no hash. Letting the browser cache it is what left a freshly
  # rebuilt container still serving the previous bundle until someone pressed
  # ctrl+shift+R — the new JS was there, but nothing pointed at it.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Brand assets are not hashed either. "no-cache" still stores them, it just
  # revalidates first, so replacing a logo or a video takes effect immediately
  # while unchanged files still come back as a cheap 304.
  location ~* \.(png|jpe?g|gif|svg|ico|mp4|webm|woff2?)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
