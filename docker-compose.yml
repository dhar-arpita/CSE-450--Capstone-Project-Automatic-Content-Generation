version: '3.8'

services:
  # Step 1.5 (DEPLOYMENT_PLAN.md, R8): one-shot SQL-table + Qdrant-collection
  # bootstrap (ops/init_db.py), run exactly once per `docker compose up`
  # instead of inside FastAPI's lifespan on every backend replica. Same image
  # as backend (same requirements, same code) — only the command differs, so
  # ops/init_db.py is bind-mounted in on top of the dev bind-mount below it
  # rather than needing its own build. No restart: policy — an init job is
  # meant to run once and exit 0; backend's depends_on (below) blocks on that
  # exit, so if this ever exits non-zero, `docker compose up` surfaces the
  # failure instead of backend silently starting against an unmigrated DB.
  init-db:
    build: ./backend
    container_name: capstone_init_db
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./ops/init_db.py:/app/ops/init_db.py:ro
    command: python ops/init_db.py

  backend:
    build: ./backend
    container_name: capstone_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}@redis:6379/1
    depends_on:
      redis:
        condition: service_started
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Phase 4 handover §2.3 — without this, nothing ever consumes the Redis
  # queue, so every dispatched job stays QUEUED forever. Same image as
  # backend (same requirements, same code); only the command differs, so it
  # builds from ./backend rather than needing its own Dockerfile. The
  # ./backend:/app bind mount matches backend's, since prompts/ is loaded by
  # relative path against the working directory and must be the same /app
  # in both containers.
  worker:
    build: ./backend
    container_name: capstone_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}@redis:6379/1
    depends_on:
      redis:
        condition: service_started
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: celery -A core.celery_app worker --loglevel=info -Q generation,ingestion --concurrency=3

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL:-http://localhost:8000}"
    container_name: capstone_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend 

  redis:
    image: redis:7-alpine
    container_name: capstone_redis
    volumes:
      - ./ops/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}"

volumes:
  redis_data: