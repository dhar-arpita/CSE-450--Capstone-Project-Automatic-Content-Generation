version: '3.8'

services:
  backend:
    build: ./backend
    container_name: capstone_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # 1. Mount the local backend folder to /app in the container
    volumes:
      - ./backend:/app
    # 2. Tell Uvicorn to watch for changes
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: capstone_frontend
    ports:
      - "3000:3000"
    # 3. Mount the frontend, but protect node_modules!
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend