# ops/redis.conf — Step 1.2 (DEPLOYMENT_PLAN.md)
#
# Redis configured as a Celery message BROKER, not a cache. The two settings
# below exist because Redis's cache-friendly defaults are wrong for a queue:
# a lost cache entry just gets recomputed, a lost queue entry is a job nobody
# will ever run again, with no error raised anywhere.
#
# The password is intentionally NOT in this file. It is appended at container
# startup via `--requirepass` from the REDIS_PASSWORD env var (see
# docker-compose.yml), so this file can be committed to git without leaking a
# secret.

# Persist the queue to disk (AOF). Without this, restarting or recreating the
# container silently drops every queued and in-flight job.
appendonly yes

# R7: never evict keys under memory pressure. Redis's default eviction
# policies assume a cache, where dropping a key just means a future cache
# miss. For a broker, an evicted key is a permanently lost Celery task.
maxmemory-policy noeviction
